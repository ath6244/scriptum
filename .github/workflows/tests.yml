name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The tests only need the scientific stack, so install those pinned versions from
      # requirements.txt (skipping PyTorch, which is large and not used by the tests).
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install $(grep -E '^(numpy|pandas|scipy|scikit-learn)==' requirements.txt) pytest

      - name: Run tests
        run: pytest -q
